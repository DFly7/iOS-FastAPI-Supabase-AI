[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "starlette>=0.38.6",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.7.1",
    "supabase>=2.24.0",
    "postgrest>=2.24.0",
    "PyJWT>=2.10.1",
    "cryptography>=41.0.7",
    "httpx>=0.28.1",
    "slowapi>=0.1.9",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "sentry-sdk>=2.17.0",
    "resend[async]>=2.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires a live local Supabase stack (supabase start); skipped in unit CI",
]
