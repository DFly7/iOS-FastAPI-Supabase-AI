# iOS: install Tuist deps, generate project, build + unit-test on Simulator.
#
# Notes:
# - CODE_SIGNING_ALLOWED=NO is set in Project.swift base settings, so no
#   certificates or provisioning profiles are required.
# - Config-Debug.xcconfig / Config-Release.xcconfig are gitignored (local secrets).
#   A CI step below generates them from Config.example.xcconfig; placeholder values
#   are sufficient for a Simulator build. Real secrets (SUPABASE_ANON_KEY etc.)
#   are not needed to compile or run tests on a Simulator.
# - Deployment target: verify ios/StarterApp/Project.swift matches simulators on
#   the pinned runner (macos-15 + bundled Xcode; adjust OS= below if needed).

name: iOS CI

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios/StarterApp

    steps:
      - uses: actions/checkout@v4

      # Pin Xcode to a known-good version so runner image updates don't silently
      # change the compiler. Keep in sync with distribute.yml.
      # Available versions: https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md
      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      # Pinned versions: .mise.toml (tuist, swiftlint). Avoid Homebrew so CI matches local `mise install`.
      - name: Install mise (Tuist + SwiftLint)
        uses: jdx/mise-action@v2
        with:
          install_args: tuist swiftlint
          working_directory: ${{ github.workspace }}

      - name: SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml

      # ── Tuist ──────────────────────────────────────────────────────────────
      # Cache resolved SPM packages fetched by `tuist install`.
      # Key includes Package.swift so the cache is busted on dependency changes.
      - name: Cache Tuist dependencies
        uses: actions/cache@v4
        with:
          path: ios/StarterApp/.build
          key: ${{ runner.os }}-tuist-${{ hashFiles('ios/StarterApp/Tuist/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-tuist-

      # Config-Debug/Release.xcconfig are gitignored (local secrets).
      # Copy the example file so Tuist can generate the project. Placeholder values
      # in the example are sufficient — no real secrets needed for a Simulator build.
      - name: Generate xcconfig from example
        run: |
          cp Config.example.xcconfig Config-Debug.xcconfig
          cp Config.example.xcconfig Config-Release.xcconfig

      - name: Fetch SPM dependencies
        run: tuist install

      - name: Generate Xcode project
        run: tuist generate --no-open

      # ── Simulator ──────────────────────────────────────────────────────────
      # The macos-15 runner ships multiple iPhone 16 simulators across iOS versions.
      # Selecting by name + OS=latest is ambiguous when more than one device shares
      # the highest OS version. Resolve to a single UDID instead and pass it as `id=`
      # so xcodebuild always gets an unambiguous match regardless of runner image updates.
      - name: Select iPhone 16 Simulator UDID
        working-directory: ${{ github.workspace }}
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import sys, json
          data = json.load(sys.stdin)['devices']
          candidates = []
          for runtime, devices in data.items():
              for d in devices:
                  if d['name'] == 'iPhone 16' and d.get('isAvailable', False):
                      candidates.append((runtime, d['udid']))
          candidates.sort(key=lambda x: x[0], reverse=True)
          print(candidates[0][1])
          ")
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Selected simulator UDID: $UDID"

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -workspace StarterApp.xcworkspace \
            -scheme StarterApp \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      # ── Unit tests ─────────────────────────────────────────────────────────
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -workspace StarterApp.xcworkspace \
            -scheme StarterApp \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:StarterAppTests \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
